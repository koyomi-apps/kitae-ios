name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Shared module and Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Test, lint and build a debug APK
        run: ./gradlew check :android:assembleDebug

      - name: Check that Room's exported schemas are committed
        run: |
          changes="$(git status --porcelain -- shared/schemas)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::Room exported a schema that differs from the committed one. Build, then commit shared/schemas."
            exit 1
          fi
