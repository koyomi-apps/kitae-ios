name: Release

# On a tag like android-v1.0.0: builds Kamae's release APK as F-Droid builds it, signs it with
# Kamae's key from the android-release environment (only android-v* tags can use it, and each run
# waits for gureet's approval), and puts it on the tag's GitHub release, a pre-release below 1.0.0.
# The tag can be pushed with git, or made on GitHub's website by publishing a release for it: then
# the APK goes on that release.

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

env:
  # The SHA-256 of Kamae's signing certificate. Once it's set, an APK signed with any other key
  # stops the release.
  CERTIFICATE_SHA256: ""

jobs:
  release:
    name: Build, sign and release the Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: android-release
    steps:
      - uses: actions/checkout@v7

      # No Gradle cache: a release builds from nothing, as F-Droid does.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Check the tag matches the app's version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#android-v}"
          app="$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' android/build.gradle.kts)"
          if [ "$tag" != "$app" ]; then
            echo "::error::The tag is for $tag, but android/build.gradle.kts has $app."
            exit 1
          fi
          echo "version=$app" >> "$GITHUB_OUTPUT"

      - name: Build the release APK
        run: ./gradlew --no-daemon :android:assembleRelease

      - name: Sign it
        env:
          VERSION: ${{ steps.version.outputs.version }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          keystore="$RUNNER_TEMP/kamae.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "kamae-$VERSION.apk" android/build/outputs/apk/release/android-release-unsigned.apk
          "$tools/apksigner" verify --print-certs "kamae-$VERSION.apk" | tee certificates.txt

      - name: Check its certificate
        id: certificate
        run: |
          digest="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' certificates.txt)"
          if [ -n "$CERTIFICATE_SHA256" ] && [ "$digest" != "$CERTIFICATE_SHA256" ]; then
            echo "::error::Signed with a key whose certificate is $digest, not Kamae's ($CERTIFICATE_SHA256)."
            exit 1
          fi
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Put it on a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          CERTIFICATE: ${{ steps.certificate.outputs.sha256 }}
        run: |
          apk="kamae-$VERSION.apk"
          prerelease=""
          case "$VERSION" in 0.*|*-*) prerelease="--prerelease" ;; esac
          {
            if [ -n "$prerelease" ]; then
              echo "A test build before Kamae 1.0.0. It installs as its own app, beside Kitae for Android 2.0.0, without touching it. To bring your plans and workouts across, back up in Kitae and restore the backup on Kamae's welcome."
              echo
            fi
            echo "- APK SHA-256: \`$(sha256sum "$apk" | cut -d ' ' -f 1)\`"
            echo "- Signing certificate SHA-256: \`$CERTIFICATE\`"
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
          if gh release view "$GITHUB_REF_NAME" --json body --jq .body > written.md 2>/dev/null; then
            # Published on the website: keep what it says, and add the APK and its fingerprints.
            if [ -s written.md ]; then printf '\n\n' >> written.md; fi
            cat notes.md >> written.md
            gh release edit "$GITHUB_REF_NAME" $prerelease --notes-file written.md
            gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$apk" $prerelease --verify-tag \
              --title "Kamae $VERSION" --notes-file notes.md
          fi
